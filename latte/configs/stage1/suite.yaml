# Stage-1 verification suite (V3 G1-G3, spec v3_proposal_2026-10-28 sections 1-17).
# Synthetic software units (V3 Sec. 9.2): L* = T* = rho* = 1.  These are NOT measured
# latte-art conditions.
suite_version: stage1_v1
seed: 20261028
thresholds:            # V3 Sec. 9.1 FP64 engineering tolerances
  local_update: 1.0e-10
  budget: 1.0e-8
  simplex: 1.0e-10
  bounds: 1.0e-12
  divergence: 1.0e-8
  rest_velocity: 1.0e-10
  M_scale_factor: 1.0e-6     # M_scale = factor * initial total mass (Sec. 9.1 denominator floor)

model:                 # common model unless a test overrides it
  rho: [1.0, 1.0, 1.0e-3]    # B, M, G
  mu: 1.0e-3                 # nu* = 1e-3 with rho* = 1
  g: 1.0
  sigma: 0.0
  liquid_min: 0.05
  wall_bc: no_slip
  bottom_bc: no_slip

numerics:
  cfl: 0.25
  wave_safety: 0.5
  cap_safety: 0.5
  scan_safety: 0.25
  retry_limit: 12
  transport_scheme: fct      # selective joint FCT on top of a flux-limited high-order flux
  ho_limiter: superbee
  momentum_recon: minmod
  pressure_solver: auto
  pressure_rtol: 1.0e-12
  viscosity_solver: auto
  viscosity_rtol: 1.0e-12
  inlet_bc: velocity         # V3 Sec. 5.2: prescribed normal velocity, Neumann pressure on the patch
  inlet_patch_cover: 0.5     # numerical choice: column joins the patch if >= 50 % covered
  quad_nr: 8
  quad_ntheta: 32
  quad_max_spacing_cells: 0.25   # polar mapping only
  inlet_mapping: subgrid         # mesh-aligned sampling of the footprint; totals from the exact polar integral
  inlet_subgrid: 8
  div_tol: 1.0e-8
  bound_tol: 1.0e-12
  max_surface_slope: 1.0

